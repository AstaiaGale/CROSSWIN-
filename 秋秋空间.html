        .box

        /* 让文字更清楚 */
        .box h1 {

            display: block;
            text-align: center;      /* 水平居中 */

            border-radius: 10px;
            margin-bottom: 30px;
        }

        /* 段落（第二、三行）：向左靠齐 + 清晰颜色 */
        .box p {
            line-height: 50px;
            color: #fff;              /* 白色，更清晰 */
            background-color: rgba(0, 0, 0, 0.6);  /* 背景更深一点，字更清楚 */

            border-radius: 10px;
            max-width: 800px;
            font-size: 22px;          /* 段落字体也稍微放大 */
            text-align: left;         /* 向左靠齐 */
            font-weight: 500;         /* 字重稍微加粗 */
        }

        .box h2 {
            color: #ffcc66;            /* 暖黄色，清晰好看 */
            background-color: rgba(0, 0, 0, 0.5);
            display: inline-block;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 24px;
            margin-top: 20px;
        }
        /* 给文字加上毛玻璃效果 */
        .box h1, .box p, .box h2, .box form, .box .nav p {
            backdrop-filter: blur(10px);  /* 背景虚化程度，数值越大越模糊 */
            background-color: rgba(0, 0, 0, 0.3);  /* 半透明黑底，让字更清楚 */
        }
